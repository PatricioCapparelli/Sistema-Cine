<div class="auth-container">
    <h2>Registro de Usuario</h2>

    <form [formGroup]="registroForm" (ngSubmit)="registrar()">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" formControlName="email">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" formControlName="password">
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" formControlName="nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" formControlName="apellido">
        </div>

        <div class="form-group">
            <label>Fecha de Nacimiento:</label>
            <div class="fecha-campos">
                <input type="text" inputmode="numeric" maxlength="2" placeholder="Día"
                    class="campo-corto" [value]="dia()" (input)="actualizarDia($event)">
                <input type="text" inputmode="numeric" maxlength="4" placeholder="Año"
                    class="campo-medio" [value]="anio()" (input)="actualizarAnio($event)">
            </div>
            <div class="chips chips-meses">
                @for (nombre of MESES; track nombre; let i = $index) {
                <button type="button" class="chip"
                    [class.activo]="mes() === i + 1"
                    (click)="elegirMes(i + 1)">
                    {{ nombre }}
                </button>
                }
            </div>
            @if (fechaInvalida()) {
            <p class="error-fecha">La fecha no es válida.</p>
            }
        </div>

        <div class="form-group">
            <label>Tipo de Sangre:</label>
            <div class="chips">
                @for (tipo of TIPOS_SANGRE; track tipo) {
                <button type="button" class="chip"
                    [class.activo]="registroForm.controls.tipo_sangre.value === tipo"
                    (click)="elegir('tipo_sangre', tipo)">
                    {{ tipo }}
                </button>
                }
            </div>
        </div>

        <div class="form-group">
            <label>Color de Ojos:</label>
            <div class="chips">
                @for (color of COLORES_OJOS; track color) {
                <button type="button" class="chip"
                    [class.activo]="registroForm.controls.color_ojos.value === color"
                    (click)="elegir('color_ojos', color)">
                    {{ color }}
                </button>
                }
            </div>
        </div>

        <div class="form-group">
            <label>Dias de Vacaciones por Año:</label>
            <div class="chips">
                @for (dias of DIAS_VACACIONES; track dias) {
                <button type="button" class="chip"
                    [class.activo]="registroForm.controls.dias_vacaciones.value === dias"
                    (click)="elegir('dias_vacaciones', dias)">
                    {{ dias }}
                </button>
                }
                <input type="number" min="0" class="campo-corto" placeholder="Otro"
                    formControlName="dias_vacaciones">
            </div>
        </div>

        <button type="submit" [disabled]="registroForm.invalid">
            Crear Cuenta
        </button>
    </form>
</div>
