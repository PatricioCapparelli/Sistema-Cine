<div class="auth-container">
    <h2>Registro de Usuario</h2>
    
    <form [formGroup]="registroForm" (ngSubmit)="registrar()">
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" formControlName="email">
        </div>

        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" formControlName="password">
        </div>

        <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" formControlName="nombre">
        </div>

        <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" formControlName="apellido">
        </div>

        <div class="form-group">
            <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
            <input type="date" id="fecha_nacimiento" formControlName="fecha_nacimiento">
        </div>

        <div class="form-group">
            <label for="tipo_sangre">Tipo de Sangre:</label>
            <select id="tipo_sangre" formControlName="tipo_sangre">
                <option value="" disabled selected>Seleccioná un tipo</option>
                <option value="A+">A+</option>
                <option value="A-">A-</option>
                <option value="B+">B+</option>
                <option value="B-">B-</option>
                <option value="AB+">AB+</option>
                <option value="AB-">AB-</option>
                <option value="O+">O+</option>
                <option value="O-">O-</option>
            </select>
        </div>

        <div class="form-group">
            <label for="color_ojos">Color de Ojos:</label>
            <select id="color_ojos" formControlName="color_ojos">
                <option value="" disabled selected>Seleccioná un color</option>
                <option value="Marrón">Marrón</option>
                <option value="Azul">Azul</option>
                <option value="Verde">Verde</option>
                <option value="Miel/Avellana">Miel/Avellana</option>
                <option value="Gris">Gris</option>
                <option value="Negro">Negro</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="dias_vacaciones">Dias de Vacaciones por Año:</label>
            <input type="number" id="dias_vacaciones" formControlName="dias_vacaciones">
        </div>

        <button type="submit" [disabled]="registroForm.invalid">
            Crear Cuenta
        </button>
    </form>
</div>
